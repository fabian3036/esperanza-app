<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Esperanza App</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    background: linear-gradient(180deg, #fdf6f0 0%, #f4f1fa 100%);
    color: #2d2a35;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  header {
    text-align: center;
    padding: 16px 16px 10px;
    flex-shrink: 0;
  }
  header h1 {
    font-size: 20px;
    font-weight: 800;
    margin: 0;
    background: linear-gradient(90deg, #7b2ff7, #f107a3);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .chips {
    display: flex;
    gap: 8px;
    padding: 0 14px 12px;
    overflow-x: auto;
    flex-shrink: 0;
    -webkit-overflow-scrolling: touch;
  }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex-shrink: 0;
    padding: 9px 14px;
    border-radius: 20px;
    background: white;
    border: 1.5px solid #ece7f2;
    font-size: 13.5px;
    font-weight: 600;
    color: #5c5567;
    display: flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
  }
  .chip.activo {
    background: linear-gradient(135deg, #7b2ff7, #a142f4);
    border-color: transparent;
    color: white;
  }

  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 8px 14px 14px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .burbuja {
    max-width: 84%;
    padding: 11px 14px;
    border-radius: 16px;
    font-size: 14.5px;
    line-height: 1.5;
  }
  .burbuja.usuario {
    align-self: flex-end;
    background: linear-gradient(135deg, #7b2ff7, #a142f4);
    color: white;
    border-bottom-right-radius: 4px;
  }
  .burbuja.app {
    align-self: flex-start;
    background: white;
    box-shadow: 0 3px 10px rgba(80,50,120,0.08);
    border-bottom-left-radius: 4px;
  }
  .burbuja.app.intro {
    background: #f3eefc;
    color: #5c4a80;
    box-shadow: none;
    font-size: 13.5px;
  }
  .burbuja.app.cargando { color: #a08fc0; font-style: italic; }
  .burbuja h3 { font-size: 14.5px; margin: 8px 0 4px; color: #4a2e7a; }
  .burbuja ul { margin: 4px 0; padding-left: 18px; }
  .burbuja p { margin: 4px 0; }
  .burbuja img.foto-msg {
    width: 100%;
    border-radius: 12px;
    margin-top: 6px;
    display: block;
  }
  .btn-confirmar {
    margin-top: 8px;
    width: 100%;
    padding: 10px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(135deg, #ef5350, #c62828);
    color: white;
    font-weight: 700;
    font-size: 14px;
  }

  .barra-entrada {
    flex-shrink: 0;
    display: flex;
    gap: 8px;
    align-items: flex-end;
    padding: 10px 14px calc(14px + env(safe-area-inset-bottom));
    background: rgba(255,255,255,0.7);
    backdrop-filter: blur(8px);
    border-top: 1px solid rgba(0,0,0,0.05);
  }
  textarea#entrada {
    flex: 1;
    resize: none;
    border: 1.5px solid #ece7f2;
    border-radius: 18px;
    padding: 11px 16px;
    font-size: 15px;
    font-family: inherit;
    background: white;
    max-height: 100px;
  }
  textarea#entrada:focus { outline: none; border-color: #c9b6ec; }
  button#enviar, label#botonFoto {
    flex-shrink: 0;
    width: 46px;
    height: 46px;
    border-radius: 50%;
    background: linear-gradient(135deg, #7b2ff7, #a142f4);
    color: white;
    border: none;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    cursor: pointer;
  }
  button#enviar:active, label#botonFoto:active { transform: scale(0.93); }
</style>
</head>
<body>

<header>
  <h1>Esperanza App</h1>
</header>

<div class="chips" id="chips"></div>

<div id="chat"></div>

<div class="barra-entrada" id="barraTexto">
  <textarea id="entrada" rows="1" placeholder="Escribe aquí..."></textarea>
  <button id="enviar" onclick="enviarTexto()">➤</button>
</div>

<div class="barra-entrada" id="barraFoto" style="display:none;">
  <label id="botonFoto" style="width:100%; border-radius:18px; font-size:15px; font-weight:700;">
    📷 Tomar foto
    <input type="file" id="inputFoto" accept="image/*" capture="environment" style="display:none" onchange="fotoTomada()">
  </label>
</div>

<script>
const API_URL = "https://esperanza-api.fabianbarboza.workers.dev";

const modos = [
  { id: "guardar",    label: "Guardar",   icono: "🧠", tipo: "texto",
    placeholder: "Ej: El filtro de mi carro es Fram CA10171",
    intro: "🧠 Aquí guardo lo que quieras recordar después. Cuéntame algo y no se te va a olvidar." },
  { id: "buscar",     label: "Preguntar", icono: "🔍", tipo: "texto",
    placeholder: "Ej: ¿Qué filtro usa mi carro?",
    intro: "🔍 Pregúntame algo y busco entre todo lo que me has contado antes." },
  { id: "identificar",label: "Ver",       icono: "📷", tipo: "foto",
    intro: "📷 Tómale foto a lo que sea y te digo qué es: objetos, plantas, animales, lo que quieras." },
  { id: "reparar",    label: "Reparar",   icono: "🔧", tipo: "foto",
    intro: "🔧 Foto a algo que se rompió y te doy el problema probable, herramientas y pasos para arreglarlo." },
  { id: "conectar",   label: "Conectar",  icono: "💡", tipo: "texto",
    placeholder: "Describe un problema, no una solución",
    intro: "💡 Cuéntame un problema (no la solución que ya tienes en mente) y te ayudo a verlo desde ángulos que quizás no habías pensado." },
  { id: "guardarIdea",label: "Idea",      icono: "💭", tipo: "texto",
    placeholder: "Ej: Combo de pizza + refresco los martes",
    intro: "💭 Suéltame cualquier idea que se te ocurra, yo la clasifico y la guardo para que no se pierda." },
  { id: "eliminar",   label: "Borrar",    icono: "🗑️", tipo: "texto",
    placeholder: "Describe qué quieres borrar",
    intro: "🗑️ Descríbeme qué nota o idea quieres borrar, te la muestro y me confirmas antes de eliminarla." }
];

let modoActual = modos[0];
let claveParaEliminar = null;

function iniciarChips() {
  const cont = document.getElementById('chips');
  cont.innerHTML = modos.map(m =>
    `<div class="chip${m.id === modoActual.id ? ' activo' : ''}" onclick="elegirModo('${m.id}')">${m.icono} ${m.label}</div>`
  ).join('');
}

function elegirModo(id) {
  if (id === modoActual.id) return;
  modoActual = modos.find(m => m.id === id);
  iniciarChips();

  agregarBurbuja("app intro", modoActual.intro);

  const entrada = document.getElementById('entrada');
  if (modoActual.tipo === "texto") {
    document.getElementById('barraTexto').style.display = "flex";
    document.getElementById('barraFoto').style.display = "none";
    entrada.placeholder = modoActual.placeholder;
  } else {
    document.getElementById('barraTexto').style.display = "none";
    document.getElementById('barraFoto').style.display = "flex";
  }
}

function formatearRespuesta(texto) {
  if (!texto) return "";
  let html = texto;
  html = html.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  html = html.replace(/^###\s+(.+)$/gm, "<h3>$1</h3>");
  html = html.replace(/^##\s+(.+)$/gm, "<h3>$1</h3>");
  html = html.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
  html = html.replace(/^[\*\-]\s+(.+)$/gm, "<li>$1</li>");
  html = html.replace(/(<li>.*<\/li>\n?)+/g, m => "<ul>" + m + "</ul>");
  html = html.split(/\n\n+/).map(b => {
    if (b.trim().startsWith("<h3>") || b.trim().startsWith("<ul>")) return b;
    return "<p>" + b.replace(/\n/g, "<br>") + "</p>";
  }).join("");
  return html;
}

function agregarBurbuja(rolClases, contenidoHTML, cargando) {
  const chat = document.getElementById('chat');
  const div = document.createElement('div');
  div.className = "burbuja " + rolClases + (cargando ? " cargando" : "");
  div.innerHTML = contenidoHTML;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

async function enviarTexto() {
  const entrada = document.getElementById('entrada');
  const texto = entrada.value.trim();
  if (!texto) return;
  entrada.value = "";

  agregarBurbuja("usuario", texto.replace(/&/g,"&amp;").replace(/</g,"&lt;"));
  const burbujaCarga = agregarBurbuja("app", "Pensando...", true);

  let body = {};
  if (modoActual.id === "guardar") body = { accion: "guardar", texto };
  else if (modoActual.id === "buscar") body = { accion: "buscar", pregunta: texto };
  else if (modoActual.id === "conectar") body = { accion: "conectar", problema: texto };
  else if (modoActual.id === "guardarIdea") body = { accion: "guardarIdea", texto };
  else if (modoActual.id === "eliminar") body = { accion: "buscarParaEliminar", descripcion: texto };

  try {
    const res = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body)
    });
    const data = await res.json();
    burbujaCarga.classList.remove("cargando");

    if (modoActual.id === "guardar") {
      burbujaCarga.innerHTML = data.ok ? "✅ Guardado" : "Error: " + (data.error || "desconocido");
    } else if (modoActual.id === "guardarIdea") {
      burbujaCarga.innerHTML = data.ok ? "✅ Guardado en: " + data.categoria : "Error: " + (data.error || "desconocido");
    } else if (modoActual.id === "eliminar") {
      if (data.encontrado) {
        claveParaEliminar = data.item.clave;
        const textoSeguro = data.item.texto.replace(/&/g,"&amp;").replace(/</g,"&lt;");
        burbujaCarga.innerHTML = "<strong>" + data.item.tipo + "</strong><p>" + textoSeguro + "</p>" +
          '<button class="btn-confirmar" onclick="confirmarEliminar(this)">Sí, borrar esto</button>';
      } else {
        burbujaCarga.textContent = data.mensaje || "No encontré nada que coincida.";
      }
    } else {
      burbujaCarga.innerHTML = data.respuesta ? formatearRespuesta(data.respuesta) : "Error: " + (data.error || "desconocido");
    }
  } catch (e) {
    burbujaCarga.classList.remove("cargando");
    burbujaCarga.textContent = "Error de conexión: " + e.message;
  }
}

async function confirmarEliminar(boton) {
  boton.disabled = true;
  boton.textContent = "Eliminando...";
  try {
    const res = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ accion: "eliminarClave", clave: claveParaEliminar })
    });
    const data = await res.json();
    boton.parentElement.innerHTML = data.ok ? "🗑️ Eliminado" : "Error al eliminar.";
    claveParaEliminar = null;
  } catch (e) {
    boton.textContent = "Error, intenta de nuevo";
    boton.disabled = false;
  }
}

function fotoTomada() {
  const input = document.getElementById('inputFoto');
  const file = input.files[0];
  if (!file) return;

  const urlPreview = URL.createObjectURL(file);
  agregarBurbuja("usuario", '<img class="foto-msg" src="' + urlPreview + '">');
  const etiqueta = modoActual.id === "identificar" ? "Analizando imagen..." : "Analizando el problema...";
  const burbujaCarga = agregarBurbuja("app", etiqueta, true);

  const reader = new FileReader();
  reader.onload = async function() {
    const base64Puro = reader.result.split(',')[1];
    try {
      const res = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ accion: modoActual.id, imagen: base64Puro, mimeType: file.type })
      });
      const data = await res.json();
      burbujaCarga.classList.remove("cargando");
      burbujaCarga.innerHTML = data.respuesta ? formatearRespuesta(data.respuesta) : "Error: " + (data.error || "desconocido");
    } catch (e) {
      burbujaCarga.classList.remove("cargando");
      burbujaCarga.textContent = "Error de conexión: " + e.message;
    }
  };
  reader.readAsDataURL(file);
  input.value = "";
}

document.getElementById('entrada').addEventListener('keydown', function(e) {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    enviarTexto();
  }
});

iniciarChips();
agregarBurbuja("app intro", modoActual.intro);
</script>

</body>
</html>
