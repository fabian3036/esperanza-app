<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Esperanza App</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, sans-serif;
    background: #f4f4f6;
    margin: 0;
    padding: 20px;
    color: #222;
  }
  h1 { font-size: 22px; text-align: center; margin-bottom: 4px; }
  p.subtitle { text-align: center; color: #666; margin-top: 0; margin-bottom: 24px; font-size: 14px; }
  .card {
    background: white;
    border-radius: 16px;
    padding: 18px;
    margin-bottom: 18px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  }
  .card h2 { font-size: 16px; margin-top: 0; }
  textarea {
    width: 100%;
    min-height: 80px;
    border: 1px solid #ddd;
    border-radius: 10px;
    padding: 10px;
    font-size: 15px;
    resize: vertical;
  }
  button, label.btn-camara {
    margin-top: 10px;
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    font-weight: 600;
    color: white;
    cursor: pointer;
    text-align: center;
    display: block;
  }
  .btn-guardar { background: #2e7d32; }
  .btn-buscar { background: #1565c0; }
  .btn-camara { background: #6a1b9a; }
  .resultado {
    margin-top: 12px;
    padding: 12px;
    border-radius: 10px;
    background: #f0f0f0;
    font-size: 15px;
    min-height: 20px;
    line-height: 1.5;
  }
  .resultado h3 { font-size: 15px; margin: 12px 0 6px 0; }
  .resultado ul { margin: 4px 0; padding-left: 20px; }
  .resultado p { margin: 6px 0; }
  .cargando { color: #888; font-style: italic; }
  img.preview {
    width: 100%;
    border-radius: 10px;
    margin-top: 10px;
  }
</style>
</head>
<body>

<h1>Esperanza App</h1>
<p class="subtitle">🧠 Memoria Externa · 📷 ¿Qué estoy viendo?</p>

<div class="card">
  <h2>🧠 Guardar algo nuevo</h2>
  <textarea id="textoGuardar" placeholder="Ej: El filtro de aire de mi carro es Fram CA10171"></textarea>
  <button class="btn-guardar" onclick="guardar()">Guardar</button>
  <div class="resultado" id="resultadoGuardar"></div>
</div>

<div class="card">
  <h2>🧠 Preguntar</h2>
  <textarea id="textoPregunta" placeholder="Ej: ¿Qué filtro de aire usa mi carro?"></textarea>
  <button class="btn-buscar" onclick="buscar()">Preguntar</button>
  <div class="resultado" id="resultadoBuscar"></div>
</div>

<div class="card">
  <h2>📷 ¿Qué estoy viendo?</h2>
  <label class="btn-camara">
    Tomar foto
    <input type="file" id="inputFoto" accept="image/*" capture="environment" style="display:none" onchange="fotoSeleccionada()">
  </label>
  <img id="preview" class="preview" style="display:none">
  <div class="resultado" id="resultadoFoto"></div>
</div>

<script>
const API_URL = "https://esperanza-api.fabianbarboza.workers.dev";

// Convierte el formato markdown simple de Gemini (**negrita**, ### títulos, - listas) a HTML
function formatearRespuesta(texto) {
  if (!texto) return "";
  let html = texto;

  // Escapar HTML peligroso primero
  html = html.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

  // Títulos ### Texto
  html = html.replace(/^###\s+(.+)$/gm, "<h3>$1</h3>");
  html = html.replace(/^##\s+(.+)$/gm, "<h3>$1</h3>");

  // Negritas **texto**
  html = html.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");

  // Listas con * o -
  html = html.replace(/^[\*\-]\s+(.+)$/gm, "<li>$1</li>");
  html = html.replace(/(<li>.*<\/li>\n?)+/g, function(match) {
    return "<ul>" + match + "</ul>";
  });

  // Líneas ---
  html = html.replace(/^---$/gm, "<hr>");

  // Saltos de línea dobles como párrafos
  html = html.split(/\n\n+/).map(function(bloque) {
    if (bloque.trim().startsWith("<h3>") || bloque.trim().startsWith("<ul>") || bloque.trim() === "<hr>") {
      return bloque;
    }
    return "<p>" + bloque.replace(/\n/g, "<br>") + "</p>";
  }).join("");

  return html;
}

async function guardar() {
  const texto = document.getElementById('textoGuardar').value.trim();
  const resultado = document.getElementById('resultadoGuardar');
  if (!texto) { resultado.textContent = "Escribe algo primero."; return; }
  resultado.textContent = "Guardando...";
  resultado.className = "resultado cargando";
  try {
    const res = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ accion: "guardar", texto })
    });
    const data = await res.json();
    resultado.className = "resultado";
    resultado.textContent = data.ok ? "✅ Guardado" : "Error: " + (data.error || "desconocido");
    if (data.ok) document.getElementById('textoGuardar').value = "";
  } catch (e) {
    resultado.className = "resultado";
    resultado.textContent = "Error de conexión: " + e.message;
  }
}

async function buscar() {
  const pregunta = document.getElementById('textoPregunta').value.trim();
  const resultado = document.getElementById('resultadoBuscar');
  if (!pregunta) { resultado.textContent = "Escribe una pregunta primero."; return; }
  resultado.textContent = "Pensando...";
  resultado.className = "resultado cargando";
  try {
    const res = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ accion: "buscar", pregunta })
    });
    const data = await res.json();
    resultado.className = "resultado";
    if (data.respuesta) {
      resultado.innerHTML = formatearRespuesta(data.respuesta);
    } else {
      resultado.textContent = "Error: " + (data.error || "desconocido");
    }
  } catch (e) {
    resultado.className = "resultado";
    resultado.textContent = "Error de conexión: " + e.message;
  }
}

function fotoSeleccionada() {
  const input = document.getElementById('inputFoto');
  const preview = document.getElementById('preview');
  const resultado = document.getElementById('resultadoFoto');
  const file = input.files[0];
  if (!file) return;

  preview.src = URL.createObjectURL(file);
  preview.style.display = "block";
  resultado.textContent = "Analizando imagen...";
  resultado.className = "resultado cargando";

  const reader = new FileReader();
  reader.onload = async function() {
    const base64Completo = reader.result;
    const base64Puro = base64Completo.split(',')[1];

    try {
      const res = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ accion: "identificar", imagen: base64Puro, mimeType: file.type })
      });
      const data = await res.json();
      resultado.className = "resultado";
      if (data.respuesta) {
        resultado.innerHTML = formatearRespuesta(data.respuesta);
      } else {
        resultado.textContent = "Error: " + (data.error || "desconocido");
      }
    } catch (e) {
      resultado.className = "resultado";
      resultado.textContent = "Error de conexión: " + e.message;
    }
  };
  reader.readAsDataURL(file);
}
</script>

</body>
</html>
